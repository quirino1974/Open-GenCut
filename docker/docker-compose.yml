name: opengencut
# Open-GenCut - backend API e database MariaDB (il team)
# Avvio: le password stanno nel file docker/.env (non versionato):
#   DB_ROOT_PASSWORD  amministratore del database (solo per manutenzione)
#   DB_APP_PASSWORD   utente applicativo "gencut" usato dal backend
# Lo schema db/schema.sql viene applicato alla prima inizializzazione del volume.
services:
  opengencut-db:
    image: mariadb:11.4
    container_name: opengencut-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: geniuscut
      MARIADB_USER: gencut
      MARIADB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - opengencut-dbdata:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - mon_mysql_net

  opengencut-api:
    image: golang:1.23-bookworm
    container_name: opengencut-api
    restart: unless-stopped
    working_dir: /src
    command: sh -c "go build -o /tmp/api . && /tmp/api"
    depends_on:
      opengencut-db:
        condition: service_healthy
    environment:
      DB_HOST: opengencut-db
      DB_PORT: "3306"
      DB_NAME: geniuscut
      DB_USER: gencut
      DB_PASSWORD: ${DB_APP_PASSWORD}
      HTTP_ADDR: ":8080"
      CHAT_ANTHROPIC_URL: ${CHAT_ANTHROPIC_URL:-https://api.anthropic.com/v1/messages}
      GOFLAGS: "-mod=mod"
      WEB_DIR: /web
      CHAT_OPENAI_URL: ${CHAT_OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      CHAT_LOCAL_URL: http://host.docker.internal:11434/v1/chat/completions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/src
      - ../web:/web:ro
      - opengencut-gocache:/go
    networks:
      - mon_mysql_net

volumes:
  opengencut-gocache:
  opengencut-dbdata:

networks:
  mon_mysql_net:
    external: true
    name: mon_mysql_net
