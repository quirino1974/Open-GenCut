# Open-GenCut - API backend (il team)
# Avvio: MSSQL_SA_PASSWORD viene letta dal .env dello stack mon_mssql_express
#. Non copiare la password in questo file.
services:
  opengencut-api:
    image: golang:1.23-bookworm
    container_name: opengencut-api
    restart: unless-stopped
    working_dir: /src
    command: sh -c "go build -o /tmp/api . && /tmp/api"
    environment:
      MSSQL_HOST: mon_mssql_express
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: geniuscut
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      HTTP_ADDR: ":8080"
      CHAT_ANTHROPIC_URL: ${CHAT_ANTHROPIC_URL:-https://api.anthropic.com/v1/messages}
      GOFLAGS: "-mod=mod"
      WEB_DIR: /web
      CHAT_OPENAI_URL: ${CHAT_OPENAI_URL:-https://api.openai.com/v1/chat/completions}
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/src
      - ../web:/web:ro
      - opengencut-gocache:/go
    networks:
      - mon_mysql_net

volumes:
  opengencut-gocache:

networks:
  mon_mysql_net:
    external: true
    name: mon_mysql_net
