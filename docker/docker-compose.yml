name: opengencut
# Open-GenCut - API backend (il team)
# Avvio: MSSQL_SA_PASSWORD viene letta dal file docker/.env (non versionato).
# Il database e' il contenitore opengencut-sql di questo stack.
services:
  opengencut-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opengencut-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - opengencut-sqldata:/var/opt/mssql
    networks:
      - mon_mysql_net

  opengencut-api:
    image: golang:1.23-bookworm
    container_name: opengencut-api
    restart: unless-stopped
    working_dir: /src
    command: sh -c "go build -o /tmp/api . && /tmp/api"
    environment:
      MSSQL_HOST: opengencut-sql
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: geniuscut
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      HTTP_ADDR: ":8080"
      CHAT_ANTHROPIC_URL: ${CHAT_ANTHROPIC_URL:-https://api.anthropic.com/v1/messages}
      GOFLAGS: "-mod=mod"
      WEB_DIR: /web
      CHAT_OPENAI_URL: ${CHAT_OPENAI_URL:-https://api.openai.com/v1/chat/completions}
      CHAT_LOCAL_URL: http://host.docker.internal:11434/v1/chat/completions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/src
      - ../web:/web:ro
      - opengencut-gocache:/go
    networks:
      - mon_mysql_net

volumes:
  opengencut-gocache:
  opengencut-sqldata:

networks:
  mon_mysql_net:
    external: true
    name: mon_mysql_net
